note: The HPE OmniStack REST API returns standard HTTP status codes (not RFC 9457 application/problem+json).
  Long-running operations return 202 Accepted with a TaskMO body whose state (IN_PROGRESS/COMPLETED/FAILED)
  and error_code/message carry per-task failure detail; poll getTask for the outcome.
problems:
- status: 401
  title: Unauthorized — missing, expired, or invalid OAuth2 bearer token (tokens expire after 10 min inactivity
    / 24 h).
- status: 403
  title: Forbidden — the authenticated principal lacks the required read/write scope or role assignment.
- status: 404
  title: Not Found — the referenced object (backup, VM, datastore, host, policy, cluster) does not exist.
