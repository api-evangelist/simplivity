        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      requestBody:
        content:
          application/vnd.simplivity.v1.19+json:
            schema:
              $ref: '#/components/schemas/register_external_store'
          application/vnd.simplivity.v1.23+json:
