components:
  schemas:
    analytics_info:
      type: object
      required:
      - data_points
      - name
      properties:
        data_points:
          type: array
          description: The metrics data points
          items:
            $ref: '#/components/schemas/MetricsDataMO'
        name:
          type: string
          description: The name of the set of metrics (iops, throughput, latency)
      description: The metrics information
    TaskMO:
      type: object
      required:
      - affected_objects
      - end_time
      - id
      - start_time
      - state
      properties:
        affected_objects:
          type: array
          description: For a completed task, the unique identifiers (UIDs) and types of the objects affected by the operation
          items:
            $ref: '#/components/schemas/AffectedObjectMO'
        end_time:
          type: string
          description: The time the task finished, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        error_code:
          type: integer
          format: int32
          description: The error code returned if a task failed
        error_message:
          type: string
          description: The error message returned if a task fails
        id:
          type: string
          description: The unique identifier (UID) of the task
        start_time:
          type: string
          description: The time the task started, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        state:
          type: string
          description: The current state of the task object
          enum:
          - IN_PROGRESS
          - COMPLETED
          - FAILED
      description: A task that was created as a result of an operation performed on the system
    AffectedObjectMO:
      type: object
      required:
      - object_id
      - object_type
      properties:
        object_id:
          type: string
          description: The unique identifier (UID) of the object affected by the completed task
        object_type:
          type: string
          description: The type of the object affected by the completed task (virtual_machine, datastore, omnistack_cluster, backup, host, policy, rule)
    set_time_zone:
      type: object
      required:
      - time_zone
      properties:
        time_zone:
          type: string
          description: Sets the time zone of the omnistack_cluster
      description: Sets the time zone of the omnistack_cluster
    omnistack_cluster:
      type: object
      required:
      - allocated_capacity
      - arbiter_address
      - arbiter_configured
      - arbiter_connected
      - arbiter_required
      - capacity_savings
      - cluster_feature_level
      - cluster_group_ids
      - compression_ratio
      - deduplication_ratio
      - efficiency_ratio
      - free_space
      - hypervisor_management_system
      - hypervisor_management_system_name
      - hypervisor_object_id
      - hypervisor_object_parent_id
      - hypervisor_object_parent_name
      - hypervisor_type
      - id
      - infosight_configuration
      - iwo_enabled
      - local_backup_capacity
      - members
      - name
      - remote_backup_capacity
      - stored_compressed_data
      - stored_uncompressed_data
      - stored_virtual_machine_data
      - type
      - used_capacity
      - used_logical_capacity
      - version
      properties:
        allocated_capacity:
          type: integer
          format: int64
          description: The amount of storage space (in bytes) defined within the host grouping
        arbiter_address:
          type: string
          description: The address of the Arbiter connected to the omnistack_cluster
        arbiter_configured:
          type: boolean
          example: false
          description: An indicator to show if an Arbiter is configured in this omnistack_cluster
        arbiter_connected:
          type: boolean
          example: false
          description: An indicator to show if the omnistack_cluster is connected to Arbiter
        arbiter_required:
          type: boolean
          example: false
          description: An indicator to show if an Arbiter is required in this omnistack_cluster
        capacity_savings:
          type: integer
          format: int64
          description: The number of total bytes saved by deduplication/compression across all hosts within the omnistack_cluster
        cluster_feature_level:
          type: integer
          format: int32
          description: The feature level of the HPE OmniStack software running on the cluster
        cluster_group_ids:
          type: array
          description: The unique identifiers (UIDs) of the cluster_groups associated with the omnistack_cluster
          items:
            type: string
        compression_ratio:
          type: string
          description: The ratio of data compressed across all hosts within the omnistack_cluster
        deduplication_ratio:
          type: string
          description: The ratio of data deduplicated across all hosts within the omnistack_cluster
        efficiency_ratio:
          type: string
          description: The efficency ratio across all host systems
        free_space:
          type: integer
          format: int64
          description: The amount of storage space (in bytes) currently free within the omnistack_cluster
        hypervisor_management_system:
          type: string
          description: The IP address of the hypervisor-based instance associated with the omnistack_cluster
        hypervisor_management_system_name:
          type: string
          description: The name of the hypervisor-based instance associated with the omnistack_cluster
        hypervisor_object_id:
          type: string
          description: The unique identifier (UID) of the hypervisor-based instance associated with the omnistack_cluster
        hypervisor_object_parent_id:
          type: string
          description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster
        hypervisor_object_parent_name:
          type: string
          description: The name of the hypervisor-based instance that contains the omnistack_cluster
        hypervisor_type:
          type: string
          description: The type of Hypervisor Management System (HMS) associated with the omnistack_cluster
          enum:
          - VSPHERE
          - HYPERV
        id:
          type: string
          description: The unique identifier (UID) of the omnistack_cluster
        infosight_configuration:
          description: The current configuration of the HPE InfoSight service
          $ref: '#/components/schemas/infosight_configuration'
        iwo_active:
          type: boolean
          example: false
          description: True if HPE SimpliVity Intelligent Workload Optimizer (IWO) is active and false otherwise
        iwo_enabled:
          type: boolean
          example: false
          description: True if HPE SimpliVity Intelligent Workload Optimizer (IWO) is active and false if it is inactive
        local_backup_capacity:
          type: integer
          format: int64
          description: The total amount of data storage used for local backups across all of the virtual machines defined within the omnistack_cluster
        members:
          type: array
          description: The unique identifiers (UIDs) of the hosts defined within the omnistack_cluster
          items:
            type: string
        name:
          type: string
          description: The name of the omnistack_cluster
        remote_backup_capacity:
          type: integer
          format: int64
          description: The total amount of data storage used for remote backup across all of the virtual machines defined within the omnistack_cluster
        stored_compressed_data:
          type: integer
          format: int64
          description: The amount of compressed data stored across all hosts within the omnistack_cluster
        stored_uncompressed_data:
          type: integer
          format: int64
          description: The amount of uncompressed data stored across all hosts within the omnistack_cluster
        stored_virtual_machine_data:
          type: integer
          format: int64
          description: The total amount of data storage consumed by all of the virtual machines defined within the omnistack_cluster
        time_zone:
          type: string
          description: The time zone of the omnistack_cluster
        type:
          type: string
          description: The type of omnistack_cluster
          enum:
          - OMNISTACK
          - EXTINCT_CLOUD_TYPE
          - UNKNOWN
        upgrade_state:
          type: string
          description: The state of any HPE OmniStack software upgrades for this omnistack_cluster
          enum:
          - FAIL_CAN_ROLLBACK
          - FAIL_CANNOT_ROLLBACK
          - IN_PROGRESS
          - SUCCESS_COMMITTED
          - SUCCESS_COMMIT_NEEDED
          - SUCCESS_MIXED_VERSION
          - UNKNOWN
        upgrade_task_id:
          type: string
          description: The unique identifier (UID) of the HPE OmniStack software upgrade task for this omnistack_cluster (if any)
        used_capacity:
          type: integer
          format: int64
          description: The used capacity across all hosts within the omnistack_cluster
        used_logical_capacity:
          type: integer
          format: int64
          description: The logical capacity across all host systems
        version:
          type: string
          description: The HPE OmniStack software version running on this omnistack_cluster or 'MIXED' if the HPE SimpliVity hosts run different versions
      description: An omnistack_cluster defined on this system
    cluster_throughput_data:
      type: object
      required:
      - data_points
      - date_of_maximum
      - date_of_minimum
      - maximum_throughput
      - minimum_throughput
      properties:
        data_points:
          type: array
          description: The metrics data points
          items:
            $ref: '#/components/schemas/MetricsRawDataMO'
        date_of_maximum:
          type: string
          description: The date for the set of metrics, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        date_of_minimum:
          type: string
          description: The date for the set of metrics, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        maximum_throughput:
          type: integer
          format: int64
          description: The maximum throughput (in bytes per second) from source to destination omnistack_cluster
        minimum_throughput:
          type: integer
          format: int64
          description: The minimum throughput (in bytes per second) from source to destination omnistack_cluster
      description: The metrics information
    omnistack_cluster_to_cluster_throughput:
      type: object
      required:
      - cluster_throughput
      - end_time
      - start_time
      properties:
        cluster_throughput:
          type: array
          description: The array of data objects representing the calculated metric values
          items:
            $ref: '#/components/schemas/omnistack_cluster_throughput'
        end_time:
          type: string
          description: The end time of the performance data used to compute the metric value
        start_time:
          type: string
          description: The start time of the performance data used to compute the metric value
      description: Calculated throughput between source and destination omnistack_clusters
    MetricsRawDataMO:
      type: object
      required:
      - date
      - value
      properties:
