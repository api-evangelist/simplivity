definitions:
  suspend_or_resume_policy:
    type: object
    required:
    - target_object_type
    properties:
      target_object_type:
        type: string
        description: The type of object where policy backups should be suspended or resumed
      target_object_id:
        type: string
        description: 'The unique identifier (UID) of the omnistack_cluster or host that suspends or resumes policy backups


          Note: An empty ID is valid if the target_object_type is federation.'
    description: Suspends or resumes policy backups
  virtual_machine:
    type: object
    required:
    - app_aware_vm_status
    - cluster_group_ids
    - compute_cluster_parent_hypervisor_object_id
    - compute_cluster_parent_name
    - created_at
    - datastore_id
    - datastore_name
    - deleted_at
    - host_id
    - hypervisor_management_system
    - hypervisor_management_system_name
    - hypervisor_object_id
    - hypervisor_type
    - id
    - name
    - omnistack_cluster_id
    - omnistack_cluster_name
    - policy_id
    - policy_name
    - replica_set
    - state
    properties:
      app_aware_vm_status:
        type: string
        description: The status of the ability of the virtual machine to take an application-consistent backup that uses Microsoft VSS
        enum:
        - UNKNOWN
        - CAPABLE
        - INVALID_CREDS
        - VALID_CREDS
        - VMWARE_TOOLS_UNAVAILABLE
        - INVALID_OS
        - UNKNOWN_FAULT
      cluster_group_ids:
        type: array
        description: The unique identifiers (UIDs) of the cluster_groups associated with the virtual_machine
        items:
          type: string
      compute_cluster_parent_hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      compute_cluster_parent_name:
        type: string
        description: The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      created_at:
        type: string
        description: The time a virtual_machine was created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      datastore_id:
        type: string
        description: The unique identifier (UID) of the datastore that is associated with the instance
      datastore_name:
        type: string
        description: The name of the datastore that is associated with the instance
      deleted_at:
        type: string
        description: The time a virtual_machine was deleted, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      ha_resynchronization_progress:
        type: integer
        format: int32
        description: The HA resynchronization progress as a percentage (0-100)
      ha_status:
        type: string
        description: The High Availability status of the virtual_machine
        enum:
        - UNKNOWN
        - OUT_OF_SCOPE
        - NOT_APPLICABLE
        - DEGRADED
        - SAFE
        - SYNCING
        - DEFUNCT
      host_id:
        type: string
        description: The unique identifier (UID) of the virtual_machine host
      host_name:
        type: string
        description: The name of the host that this virtual machine is currently assigned to
      hypervisor_allocated_capacity:
        type: integer
        format: int64
        description: The total number of bytes allocated to this virtual machine across all datastores
      hypervisor_allocated_cpu:
        type: integer
        format: int64
        description: The amount of CPU available to this virtual machine in MHz
      hypervisor_consumed_cpu:
        type: integer
        format: int64
        description: The amount of CPU consumed by this virtual machine in MHz
      hypervisor_consumed_memory:
        type: integer
        format: int32
        description: The number of MB actively used by this virtual machine
      hypervisor_cpu_count:
        type: integer
        format: int32
        description: The number of virtual CPUs allocated to this virtual machine
      hypervisor_folder_name:
        type: string
        description: The name of the folder this virtual machine is stored in
      hypervisor_free_space:
        type: integer
        format: int64
        description: The number of bytes of free space available to this virtual machine across all datastores
      hypervisor_instance_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance associated with a virtual_machine
      hypervisor_is_template:
        type: boolean
        example: false
        description: An indicator that shows if the virtual machine is a template
      hypervisor_managed_by:
        type: string
        description: The managed by property of the virtual machine
      hypervisor_management_system:
        type: string
        description: The IP address of the hypervisor-based instance associated with the virtual machine
      hypervisor_management_system_name:
        type: string
        description: The name of the hypervisor-based instance associated with the virtual machine
      hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance associated with a virtual_machine
      hypervisor_total_memory:
        type: integer
        format: int32
        description: The number of MB allocated to this virtual machine
      hypervisor_type:
        type: string
        description: The type of hypervisor associated with the virtual_machine
        enum:
        - VSPHERE
        - HYPERV
      hypervisor_uuid:
        type: string
        description: The SMBIOS unique identifier (UID) of the hypervisor-based instance associated with a virtual_machine
      hypervisor_virtual_disk_count:
        type: integer
        format: int32
        description: The number of virtual disks assigned to this virtual machine
      hypervisor_virtual_machine_power_state:
        type: string
        description: The power state of the virtual machine (ON, OFF, SUSPENDED, or UNKNOWN)
        enum:
        - 'ON'
        - 'OFF'
        - SUSPENDED
        - UNKNOWN
      id:
        type: string
        description: The unique identifier (UID) of the virtual_machine
      name:
        type: string
        description: The name of the virtual_machine
      network_interfaces:
        type: array
        description: A virtualized network interface associated with the virtual_machine
        items:
          $ref: '#/definitions/NetworkInterface'
      omnistack_cluster_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster that is associated with the instance
      omnistack_cluster_name:
        type: string
        description: The name of the omnistack_cluster that is associated with the instance
      policy_id:
        type: string
        description: The unique identifier (UID) of the policy that is associated with the instance
      policy_name:
        type: string
        description: The name of the policy that is associated with the instance
      replica_set:
        type: array
        description: The primary and secondary hosts that store a replica of the data for this virtual_machine
        items:
          $ref: '#/definitions/ReplicaInfo'
      state:
        type: string
        description: The state of the virtual_machine
        enum:
        - ALIVE
        - REMOVED
        - DELETED
    description: An instance of a virtual_machine defined on this system
  AffectedObjectMO:
    type: object
    required:
    - object_id
    - object_type
    properties:
      object_id:
        type: string
        description: The unique identifier (UID) of the object affected by the completed task
      object_type:
        type: string
        description: The type of the object affected by the completed task (virtual_machine, datastore, omnistack_cluster, backup, host, policy, rule)
  rule:
    type: object
    required:
    - frequency
    - retention
    properties:
      destination_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster to store the backup
      id:
        type: string
        description: The unique identifier (UID) of the policy rule
      frequency:
        type: integer
        format: int32
        description: The number of minutes between backups
      number:
        type: integer
        format: int32
        description: The incremental number of the rule in the policy
      destination_name:
        type: string
        description: The name of the omnistack_cluster to store the backup or &lt;local&gt; for the local omnistack_cluster
      retention:
        type: integer
        format: int32
        description: The number of minutes to keep backups
      days:
        type: string
        description: The days of the week (for example, Mon,Fri), or month (for example, 1,15) to take backups or "last" to specify the last day of each month
      max_backups:
        type: integer
        format: int32
        description: The maximum number of backups to save for this rule
      external_store_name:
        type: string
        description: The name of the external_store
      start_time:
        type: string
        description: The time to start the backups, for example, 14:30. This time is local to the time zone of the Hypervisor Management System (HMS).
      end_time:
        type: string
        description: The time to stop backing up, for example, 14:30. This time is local to the time zone of the Hypervisor Management System (HMS).
      application_consistent:
        type: boolean
        example: false
        description: Set to false for crash-consistent backups. Set to true for application-consistent backups (for example, VSS or snapshot backups).
      consistency_type:
        type: string
        description: Set to DEFAULT for a snapshot backup. Set to VSS for a Microsoft Volume Shadow Copy Service backup. Set to NONE for crash-consistent backups.
        enum:
        - NONE
        - DEFAULT
        - FAILEDVSS
        - NOT_APPLICABLE
        - VSS
    description: A backup policy rule defined on this system
  datastore:
    type: object
    required:
    - cluster_group_ids
    - compute_cluster_parent_hypervisor_object_id
    - compute_cluster_parent_name
    - created_at
    - hypervisor_management_system
    - hypervisor_management_system_name
    - hypervisor_object_id
    - hypervisor_type
    - id
    - mount_directory
    - name
    - omnistack_cluster_id
    - omnistack_cluster_name
    - policy_id
    - policy_name
    - shares
    - size
    properties:
      cluster_group_ids:
        type: array
        description: The unique identifiers (UIDs) of the cluster_groups associated with the datastore
        items:
          type: string
      compute_cluster_parent_hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      compute_cluster_parent_name:
        type: string
        description: The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      created_at:
        type: string
        description: The time the datastore was created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      deleted:
        type: boolean
        example: false
        description: '[deprecated] An indicator to show if the datastore is deleted'
      hypervisor_free_space:
        type: integer
        format: int64
        description: The amount of free space (in bytes) available in the datastore
      hypervisor_management_system:
        type: string
        description: The IP address of the Hypervisor Management System (HMS) associated with the datastore
      hypervisor_management_system_name:
        type: string
        description: The name of the Hypervisor Management System (HMS) associated with the datastore
      hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance associated with the datastore
      hypervisor_type:
        type: string
        description: The type of Hypervisor Management System (HMS) associated with the datastore
        enum:
        - VSPHERE
        - HYPERV
      id:
        type: string
        description: The unique identifier (UID) of the datastore
      mount_directory:
        type: string
        description: The mount point on the system associated with the datastore
      name:
        type: string
        description: The name of the datastore
      omnistack_cluster_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster associated with the datastore
      omnistack_cluster_name:
        type: string
        description: The name of the omnistack_cluster associated with the datastore
      policy_id:
        type: string
        description: The unique identifier (UID) of the policy associated with the datastore
      policy_name:
        type: string
        description: The name of the policy associated with the datastore
      shares:
        type: array
        description: A list of hosts that access the datastore, but do not run HPE OmniStack software
        items:
          $ref: '#/definitions/share'
      single_replica:
        type: boolean
        example: false
        description: Whether the datastore contains only single-replica virtual machines (no storage HA)
      size:
        type: integer
        format: int64
        description: The size (in bytes) of the datastore
    description: An instance of a datastore that is defined on this system
  share:
    type: object
    required:
    - address
    - host
    - rw
    properties:
      address:
        type: string
        description: The network address of the host that shares the datastore
      host:
        type: string
        description: The name of the host that shares the datastore
      rw:
        type: string
        description: 'An indicator that shows the mode of the datastore


          Valid values:


          True: The datastore is being shared in read/write mode.


          False: The datastore is being shared in read-only mode.'
    description: An object (host) that shares the datastore
  NetworkInterface:
    type: object
    required:
    - adapter_type
    - device_number
    - ipv4_addresses
    - mac_address
    - mac_generation
    - network_label
    properties:
      adapter_type:
        type: string
        description: The adapter type of the network_interface
        enum:
        - E1000
        - E1000E
        - PCNET32
        - VMXNET
        - VNXNET2
        - VMXNET3
        - UNKNOWN
      device_number:
        type: string
        description: The device number of the network_interface; empty if this represents a new network_interface
      ipv4_addresses:
        type: array
        description: The IPV4 address(es) assigned to the network_interface
        items:
          type: string
      mac_address:
        type: string
        description: If mac_generation is set to MANUAL, specifies the MAC address assigned to the network_interface
      mac_generation:
        type: string
        description: Specifies how the MAC address for the network_interface is generated
        enum:
        - ASSIGNED
        - GENERATED
        - MANUAL
        - UNKNOWN
      network_label:
        type: string
        description: The network ID associated with the network_interface
  policy_schedule_impact_report:
    type: object
    required:
    - schedule_after_change
    - schedule_before_change
    properties:
      schedule_after_change:
        description: The policy backup schedule report
        $ref: '#/definitions/policy_schedule_report'
      schedule_before_change:
        description: The policy backup schedule report
        $ref: '#/definitions/policy_schedule_report'
    description: The policy backup schedule reports for prior to and after applying proposed changes
  create_or_edit_rule:
    type: object
    required:
    - frequency
    - retention
    properties:
      destination_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster to store the backup
      frequency:
        type: integer
        format: int32
        description: The number of minutes between backups
      retention:
        type: integer
        format: int32
        description: The number of minutes to keep backups
      days:
        type: string
        description: The days of the week (for example, Mon,Fri), or month (for example, 1,15) to take backups or "last" to specify the last day of each month
      start_time:
        type: string
        description: The time to start the backups, for example, 14:30. This time is local to the time zone of the Hypervisor Management System (HMS).
      end_time:
        type: string
        description: The time to stop backing up, for example, 14:30. This time is local to the time zone of the Hypervisor Management System (HMS).
      application_consistent:
        type: boolean
        example: false
        description: Set to false for crash-consistent backups. Set to true for application-consistent backups (for example, VSS or snapshot backups).
      consistency_type:
        type: string
        description: Set to DEFAULT for a snapshot backup. Set to VSS for a Microsoft Volume Shadow Copy Service backup. Set to NONE for crash-consistent backups.
        enum:
        - NONE
        - DEFAULT
        - FAILEDVSS
        - NOT_APPLICABLE
        - VSS
      external_store_name:
        type: string
        description: 'The external store to hold the backup.

          Cannot be specified if destination_id is set.'
    description: Creates a policy rule
  report_on_proposed_rules_edits:
    type: object
    required:
    - frequency
    - retention
    - rule_id
    properties:
      destination_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster to store the backup
      rule_id:
        type: string
        description: The unique identifier (UID) of the policy rule
      frequency:
        type: integer
        format: int32
        description: The number of minutes between backups
      retention:
        type: integer
        format: int32
        description: The number of minutes to keep backups
      days:
        type: string
        description: The days of the week (for example, Mon,Fri), or month (for example, 1,15) to take backups or "last" to specify the last day of each month
      start_time:
        type: string
        description: The time to start the backups, for example, 14:30. This time is local to the time zone of the Hypervisor Management System (HMS).
      end_time:
        type: string
        description: The time to stop backing up, for example, 14:30. This time is local to the time zone of the Hypervisor Management System (HMS).
      application_consistent:
        type: boolean
        example: false
        description: Set to false for crash-consistent backups. Set to true for application-consistent backups (for example, VSS or snapshot backups).
      consistency_type:
        type: string
        description: Set to DEFAULT for a snapshot backup. Set to VSS for a Microsoft Volume Shadow Copy Service backup. Set to NONE for crash-consistent backups.
        enum:
        - NONE
        - DEFAULT
        - FAILEDVSS
        - NOT_APPLICABLE
        - VSS
      external_store_name:
        type: string
        description: 'The external store to hold the backup.

          Cannot be specified if destination_id is set.'
    description: Generate a backup impact reported based on proposed changes to the rules for the policy
  policy_schedule_report:
    type: object
    required:
    - backup_rate_level
    - daily_backup_rate
    - daily_backup_rate_limit
    - projected_retained_backups
    - projected_retained_backups_level
    - retained_backups_limit
    properties:
      backup_rate_level:
        type: integer
        format: int32
        description: The ratio in percent of daily_backup_rate vs daily_backup_rate_limit (i.e. What % of the maximum limit is currently specified)
      daily_backup_rate:
        type: integer
        format: int32
        description: The average number of backups created in a day in the federation as determined by the current set of backup policies and their rules, and the virtual machines assigned to those backup policies
      daily_backup_rate_limit:
        type: integer
        format: int32
        description: The maximum number of policy backups allowed to be created in the federation each day
      projected_retained_backups:
        type: integer
        format: int32
        description: The projection of the maximum number of backups that could be retained given the frequency and retention time specified by the backup policies and the virtual machines assigned to those backup policies
      projected_retained_backups_level:
        type: integer
        format: int32
        description: The ratio in percent of projected_retained_backups vs retained_backups_limit (i.e. What % of the maximum limit is currently specified)
      retained_backups_limit:
        type: integer
        format: int32
        description: The maximum number of policy backups the federation is permitted to have at any given time
    description: A policy on this system
  create_or_rename_policy:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: The name of the policy
    description: Creates a new policy
  ReplicaInfo:
    type: object
    required:
    - id
    - role
    properties:
      id:
        type: string
        description: The unique identifier (UID) of the host storing the replica
      role:
        type: string
        description: The role of the replica
        enum:
        - PRIMARY
        - SECONDARY
  policy:
    type: object
    required:
    - cluster_group_ids
    - id
    - name
    - owner_cluster_id
    - owner_cluster_name
    - rules
    properties:
      cluster_group_ids:
        type: array
        description: The unique identifiers (UIDs) of the cluster_groups associated with the policy
        items:
          type: string
      owner_cluster_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster that owns the policy
      owner_cluster_name:
        type: string
        description: The name of the omnistack_cluster that owns the policy
      id:
        type: string
        description: The unique identifier (UID) of the policy
      name:
        type: string
        description: The name of the policy
      rules:
        type: array
        description: The rules for the policy
        items:
          $ref: '#/definitions/rule'
    description: A policy on this system
  TaskMO:
    type: object
    required:
    - affected_objects
    - end_time
    - id
    - start_time
    - state
    properties:
      affected_objects:
        type: array
        description: For a completed task, the unique identifiers (UIDs) and types of the objects affected by the operation
        items:
          $ref: '#/definitions/AffectedObjectMO'
      end_time:
        type: string
