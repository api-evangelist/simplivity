      - name: show_optional_fields
        in: query
        description: 'An indicator to show the hypervisor_free_space of the datastore


          Note: This value is computed from various sources. Consequently, the retrieval of this value may adversely affect the response time of a request.'
        required: false
        type: boolean
        default: false
      - name: id
        in: query
        description: 'The unique identifier (UID) of the datastores to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: name
        in: query
        description: 'The name of the datastores to return


          Accepts: Single value, comma-separated list, pattern using one or more asterisk characters as a wildcard'
        required: false
        type: string
      - name: min_size
        in: query
        description: The minimum size (in bytes) of datastores to return
        required: false
        type: integer
        format: int64
      - name: max_size
        in: query
        description: The maximum size (in bytes) of datastores to return
        required: false
        type: integer
        format: int64
      - name: created_before
        in: query
        description: The latest creation time before the datastores to return were created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        required: false
        type: string
      - name: created_after
        in: query
        description: The earliest creation time after the datastores to return were created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        required: false
        type: string
      - name: omnistack_cluster_id
        in: query
        description: 'The unique identifier (UID) of the omnistack_cluster that is associated with the instances to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: omnistack_cluster_name
        in: query
        description: 'The name of the omnistack_cluster that is associated with the instances to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: compute_cluster_parent_hypervisor_object_id
        in: query
        description: 'The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instances to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: compute_cluster_parent_name
        in: query
        description: 'The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instances to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: hypervisor_management_system_name
        in: query
        description: 'The name of the Hypervisor Management System (HMS) associated with the datastore


          Accepts: Single value, comma-separated list, pattern using one or more asterisk characters as a wildcard'
        required: false
        type: string
      - name: policy_id
        in: query
        description: 'The unique identifier (UID) of the policy that is associated with the instances to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: policy_name
        in: query
        description: 'The name of the policy that is associated with the instances to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: hypervisor_object_id
        in: query
        description: 'The unique identifier (UID) of the hypervisor-based instance  that is associated with the instances to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: mount_directory
        in: query
        description: 'The mount point on the system associated with the datastores to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: cluster_group_id
        in: query
        description: 'The unique identifiers (UIDs) of the cluster_groups associated with the datastores to return


          Accepts: Single value, comma-separated list'
        required: false
        type: string
      - name: fields
        in: query
        description: "A comma-separated list of fields to include in the returned objects\n\n Default: Returns all fields"
        required: false
        type: string
      - name: limit
        in: query
        description: 'A positive integer that represents the maximum number of results to return


          Default: 500'
        required: false
        type: integer
        default: 500
        format: int32
      - name: offset
        in: query
        description: 'A positive integer that directs the service to start returning the &lt;offset value&gt; instance, up to the limit


          Default: 0'
        required: false
        type: integer
        default: 0
        format: int32
      - name: case
        in: query
        description: 'An indicator that specifies if the filter and sort results use a case-sensitive or insensitive manner


          Valid values: sensitive or insensitive


          Default: sensitive'
        required: false
        type: string
        default: sensitive
        enum:
        - sensitive
        - insensitive
      - name: sort
        in: query
        description: The name of the field where the sort occurs
        required: false
        type: string
      - name: order
        in: query
        description: 'The sort order preference


          Valid values: ascending or descending


          Default: descending'
        required: false
        type: string
      - name: single_replica
        in: query
        description: Whether the datastore contains only single-replica virtual machines (no storage HA)
        required: false
        type: boolean
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/datastore'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
