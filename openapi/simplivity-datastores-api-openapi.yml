definitions:
  AffectedObjectMO:
    type: object
    required:
    - object_id
    - object_type
    properties:
      object_id:
        type: string
        description: The unique identifier (UID) of the object affected by the completed task
      object_type:
        type: string
        description: The type of the object affected by the completed task (virtual_machine, datastore, omnistack_cluster, backup, host, policy, rule)
  unshare_datastore:
    type: object
    required:
    - host_name
    properties:
      host_name:
        type: string
        description: The name of the standard host that needs to stop sharing a datastore
    description: Stop sharing a datastore
  share_datastore:
    type: object
    required:
    - host_name
    properties:
      host_name:
        type: string
        description: The name of the standard host that you want sharing a datastore
    description: Share a datastore
  datastore:
    type: object
    required:
    - cluster_group_ids
    - compute_cluster_parent_hypervisor_object_id
    - compute_cluster_parent_name
    - created_at
    - hypervisor_management_system
    - hypervisor_management_system_name
    - hypervisor_object_id
    - hypervisor_type
    - id
    - mount_directory
    - name
    - omnistack_cluster_id
    - omnistack_cluster_name
    - policy_id
    - policy_name
    - shares
    - size
    properties:
      cluster_group_ids:
        type: array
        description: The unique identifiers (UIDs) of the cluster_groups associated with the datastore
        items:
          type: string
      compute_cluster_parent_hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      compute_cluster_parent_name:
        type: string
        description: The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      created_at:
        type: string
        description: The time the datastore was created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      deleted:
        type: boolean
        example: false
        description: '[deprecated] An indicator to show if the datastore is deleted'
      hypervisor_free_space:
        type: integer
        format: int64
        description: The amount of free space (in bytes) available in the datastore
      hypervisor_management_system:
        type: string
        description: The IP address of the Hypervisor Management System (HMS) associated with the datastore
      hypervisor_management_system_name:
        type: string
        description: The name of the Hypervisor Management System (HMS) associated with the datastore
      hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance associated with the datastore
      hypervisor_type:
        type: string
        description: The type of Hypervisor Management System (HMS) associated with the datastore
        enum:
        - VSPHERE
        - HYPERV
      id:
        type: string
        description: The unique identifier (UID) of the datastore
      mount_directory:
        type: string
        description: The mount point on the system associated with the datastore
      name:
        type: string
        description: The name of the datastore
      omnistack_cluster_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster associated with the datastore
      omnistack_cluster_name:
        type: string
        description: The name of the omnistack_cluster associated with the datastore
      policy_id:
        type: string
        description: The unique identifier (UID) of the policy associated with the datastore
      policy_name:
        type: string
        description: The name of the policy associated with the datastore
      shares:
        type: array
        description: A list of hosts that access the datastore, but do not run HPE OmniStack software
        items:
          $ref: '#/definitions/share'
      single_replica:
        type: boolean
        example: false
        description: Whether the datastore contains only single-replica virtual machines (no storage HA)
      size:
        type: integer
        format: int64
        description: The size (in bytes) of the datastore
    description: An instance of a datastore that is defined on this system
  share:
    type: object
    required:
    - address
    - host
    - rw
    properties:
      address:
        type: string
        description: The network address of the host that shares the datastore
      host:
        type: string
        description: The name of the host that shares the datastore
      rw:
        type: string
        description: 'An indicator that shows the mode of the datastore


          Valid values:


          True: The datastore is being shared in read/write mode.


          False: The datastore is being shared in read-only mode.'
    description: An object (host) that shares the datastore
  resize_datastore:
    type: object
    required:
    - size
    properties:
      size:
        type: integer
        format: int64
        description: The size (in bytes) of the datastore
    description: Resizes a datastore
  create_datastore:
    type: object
    required:
    - name
    - omnistack_cluster_id
    - policy_id
    - size
    properties:
      name:
        type: string
        description: The name of the datastore
      omnistack_cluster_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster associated with the datastore
      policy_id:
        type: string
        description: The unique identifier (UID) of the policy associated with the datastore
      single_replica:
        type: boolean
        example: false
        description: An indicator to show if this is a single-replica datastore
      size:
        type: integer
        format: int64
        description: The size (in bytes) of the datastore
    description: Creates a new datastore
  standard_host:
    type: object
    required:
    - hypervisor_object_id
    - ip_address
    - name
    properties:
      hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the standard host
      ip_address:
        type: string
        description: The IP address of the standard host
      name:
        type: string
        description: The name of the standard host
      shared:
        type: boolean
        example: false
        description: Confirms that the standard host shares a datastore
      virtual_machine_count:
        type: integer
        format: int32
        description: The number of virtual machines on this host
    description: A standard host (host without HPE Omnistack software) defined on this system.
  set_policy:
    type: object
    required:
    - policy_id
    properties:
      policy_id:
        type: string
        description: The unique identifier (UID) of the policy you want to access
    description: Sets the backup policy for a virtual_machine or datastore
  TaskMO:
    type: object
    required:
    - affected_objects
    - end_time
    - id
    - start_time
    - state
    properties:
      affected_objects:
        type: array
        description: For a completed task, the unique identifiers (UIDs) and types of the objects affected by the operation
        items:
          $ref: '#/definitions/AffectedObjectMO'
      end_time:
        type: string
        description: The time the task finished, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      error_code:
        type: integer
        format: int32
        description: The error code returned if a task failed
      error_message:
        type: string
        description: The error message returned if a task fails
      id:
        type: string
        description: The unique identifier (UID) of the task
      start_time:
        type: string
        description: The time the task started, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      state:
        type: string
        description: The current state of the task object
        enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    description: A task that was created as a result of an operation performed on the system
securityDefinitions:
  OAuth2:
    type: oauth2
    tokenUrl: /oauth/token
    flow: password
    scopes:
      read: Grants read access
      write: Grants write access
