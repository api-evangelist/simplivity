openapi: 3.2.0
info:
  description: This API enables the programmatic management of key components of an HPE SimpliVity configuration.
  version: '1.25'
  title: HPE OmniStack REST Tasks API
  contact:
    name: Hewlett Packard Enterprise
  license:
    name: HPE OmniStack REST API
servers:
- url: https://localhost
tags:
- name: Tasks
  description: A task is created by the system to enable a client to track state changes where a managed object moves when it is created or modified.
paths:
  /tasks/{taskId}:
    get:
      tags:
      - Tasks
      summary: Retrieves the specified task
      operationId: getTask
      parameters:
      - name: taskId
        in: path
        description: The unique identifier (UID) of the task that you want to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.simplivity.v1.23+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.9+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.18+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.14+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.11+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.17+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.21+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.22+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.3+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.10+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.6+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.25+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.19+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.5+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.13+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.16+json:
              schema:
                $ref: '#/components/schemas/TaskMO'
            application/vnd.simplivity.v1.2+json:
