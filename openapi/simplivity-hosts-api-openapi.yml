definitions:
  analytics_info:
    type: object
    required:
    - data_points
    - name
    properties:
      data_points:
        type: array
        description: The metrics data points
        items:
          $ref: '#/definitions/MetricsDataMO'
      name:
        type: string
        description: The name of the set of metrics (iops, throughput, latency)
    description: The metrics information
  AffectedObjectMO:
    type: object
    required:
    - object_id
    - object_type
    properties:
      object_id:
        type: string
        description: The unique identifier (UID) of the object affected by the completed task
      object_type:
        type: string
        description: The type of the object affected by the completed task (virtual_machine, datastore, omnistack_cluster, backup, host, policy, rule)
  MetricsRawDataMO:
    type: object
    required:
    - date
    - value
    properties:
      date:
        type: string
        description: The date for the set of metrics, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      value:
        type: object
        description: A metrics result value
  MetricsDataMO:
    type: object
    required:
    - date
    - reads
    - writes
    properties:
      date:
        type: string
        description: The date for the set of metrics, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      reads:
        type: integer
        format: int64
        description: The number of reads per second or latency (in microseconds) or throughput (in bytes per second)
      writes:
        type: integer
        format: int64
        description: The number of writes per second or latency (in microseconds) or throughput (in bytes per second)
  battery:
    type: object
    required:
    - firmware_revision
    - health
    - manufacturer
    - manufacturing_date
    - model_number
    - percent_charged
    - serial_number
    - status
    properties:
      firmware_revision:
        type: string
        description: The firmware revision of the hardware component
      health:
        type: string
        description: The health status for the battery (HEALTHY, MISSING, FAILED, DEGRADED, or UNKNOWN)
      manufacturer:
        type: string
        description: The manufacturer of the hardware component
      manufacturing_date:
        type: string
        description: The manufacturing date of the battery
      model_number:
        type: string
        description: The model number of the hardware component
      percent_charged:
        type: integer
        format: int32
        description: The charged percentage for the battery
      serial_number:
        type: string
        description: The serial number of the hardware component
      status:
        type: string
        description: The status of the hardware component (GREEN, YELLOW, RED, or UNKNOWN)
    description: The backup battery unit information for the host
  storage_adapter:
    type: object
    required:
    - firmware_revision
    - has_bbu
    - manufacturer
    - model_number
    - product_name
    - serial_number
    - status
    properties:
      firmware_revision:
        type: string
        description: The firmware revision of the hardware component
      has_bbu:
        type: string
        description: An indicator that specifies whether the hardware component has a backup battery unit
      manufacturer:
        type: string
        description: The manufacturer of the hardware component
      model_number:
        type: string
        description: The model number of the hardware component
      product_name:
        type: string
        description: The product name for the hardware component
      serial_number:
        type: string
        description: The serial number of the hardware component
      status:
        type: string
        description: The status of the hardware component (GREEN, YELLOW, RED, or UNKNOWN)
    description: The storage adapter information for the host
  host:
    type: object
    required:
    - availability_zone_effective
    - availability_zone_planned
    - can_rollback
    - cluster_feature_level
    - cluster_group_ids
    - compute_cluster_hypervisor_object_id
    - compute_cluster_name
    - compute_cluster_parent_hypervisor_object_id
    - compute_cluster_parent_name
    - current_feature_level
    - federation_ip
    - federation_mask
    - federation_mtu
    - hypervisor_management_system
    - hypervisor_management_system_name
    - hypervisor_object_id
    - id
    - management_ip
    - management_mask
    - management_mtu
    - model
    - name
    - omnistack_cluster_id
    - policy_enabled
    - potential_feature_level
    - state
    - storage_ip
    - storage_mask
    - storage_mtu
    - type
    - upgrade_state
    - version
    - virtual_controller_name
    properties:
      allocated_capacity:
        type: integer
        format: int64
        description: The amount of storage space (in bytes) defined for the host
      availability_zone_effective:
        type: string
        description: The effectively-assigned availability zone
      availability_zone_planned:
        type: string
        description: The planned-assigned availability zone. This will become the effectively-assigned zone once the zone changes are realized.
      can_rollback:
        type: boolean
        example: false
        description: 'An indicator to show if the current HPE OmniStack software running on the host can roll back to the previous version


          Valid values:


          True: The current HPE OmniStack software for the host can roll back to the previous version.


          False: The current HPE OmniStack software for the host cannot roll back to the previous version.'
      capacity_savings:
        type: integer
        format: int64
        description: The number of total bytes saved by deduplication/compression for the host
      cluster_feature_level:
        type: integer
        format: int32
        description: The cluster feature level of the HPE OmniStack software running on the host
      cluster_group_ids:
        type: array
        description: The unique identifiers (UIDs) of the cluster_groups associated with the host
        items:
          type: string
      compression_ratio:
        type: string
        description: The ratio of data compressed for the host
      compute_cluster_hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the Hypervisor Management System (HMS) for the associated compute cluster
      compute_cluster_name:
        type: string
        description: The name of the compute cluster associated with the host
      compute_cluster_parent_hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      compute_cluster_parent_name:
        type: string
        description: The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      current_feature_level:
        type: integer
        format: int32
        description: The current feature level of the HPE OmniStack software running on the host
      date:
        type: string
        description: The date for the set of metrics, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      deduplication_ratio:
        type: string
        description: The ratio of data deduplicated for the host
      efficiency_ratio:
        type: string
        description: The efficency ratio for the host
      federation_ip:
        type: string
        description: The IP address of the federation
      federation_mask:
        type: string
        description: The network mask of the federation
      federation_mtu:
        type: string
        description: The MTU of the federation
      free_space:
        type: integer
        format: int64
        description: The amount of storage space (in bytes) currently free for the host
      hypervisor_management_system:
        type: string
        description: The IP address of the Hypervisor Management System (HMS) associated with the host
      hypervisor_management_system_name:
        type: string
        description: The name of the Hypervisor Management System (HMS) associated with the host
      hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance associated with the host
      id:
        type: string
        description: The unique identifier (UID) of the host
      local_backup_capacity:
        type: integer
        format: int64
        description: The total amount of data storage used for local backups of the virtual machines defined for the host
      management_ip:
        type: string
        description: The IP address of the HPE OmniStack management module that runs on the host
      management_mask:
        type: string
        description: The network mask of the HPE OmniStack management module that runs on the host
      management_mtu:
        type: string
        description: The MTU of the OmniStack management module that runs on the host
      model:
        type: string
        description: The model of the host
      name:
        type: string
        description: The name of the host
      omnistack_cluster_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster associated with the host
      policy_enabled:
        type: boolean
        example: false
        description: 'An indicator to show the status of the backup policy for the host


          Valid values:


          True: The backup policy for the host is enabled.


          False: The backup policy for the host is disabled.'
      potential_feature_level:
        type: integer
        format: int32
        description: The potential feature level of the HPE OmniStack software running on the host
      remote_backup_capacity:
        type: integer
        format: int64
        description: The total amount of data storage used for remote backup of the virtual machines defined for the host
      state:
        type: string
        description: The current state of the host
        enum:
        - ALIVE
        - FAULTY
        - MANAGED
        - REMOVED
        - SUSPECTED
        - UNKNOWN
      storage_ip:
        type: string
        description: The IP address of the HPE OmniStack storage module that runs on the host
      storage_mask:
        type: string
        description: The network mask of the HPE OmniStack storage module that runs on the host
      storage_mtu:
        type: string
        description: The MTU of the HPE OmniStack storage module that runs on the host
      stored_compressed_data:
        type: integer
        format: int64
        description: The amount of compressed data stored for the host
      stored_uncompressed_data:
        type: integer
        format: int64
        description: The amount of uncompressed data stored for the host
      stored_virtual_machine_data:
        type: integer
        format: int64
        description: The total amount of data storage consumed by all of the virtual machines defined within the host
      type:
        type: string
        description: The type of host
      upgrade_state:
        type: string
        description: The state of the most recent HPE OmniStack software upgrade for this host (SUCCESS, FAIL, IN_PROGRESS, NOOP, UNKNOWN)
        enum:
        - SUCCESS
        - FAIL
        - IN_PROGRESS
        - NOOP
        - UNKNOWN
      used_capacity:
        type: integer
        format: int64
        description: The used capacity for the host
      used_logical_capacity:
        type: integer
        format: int64
        description: The logical capacity for the host system
      version:
        type: string
        description: The version of the host
      virtual_controller_name:
        type: string
        description: The name of the Virtual Controller that runs on the host
    description: A host that is defined on this system
  drive_set:
    type: object
    required:
    - drive_number
    - firmware_revision
    - health
    - manufacturer
    - model_number
    - physical_drives
    - serial_number
    - status
    properties:
      drive_number:
        type: integer
        format: int32
        description: The drive number
      firmware_revision:
        type: string
        description: The firmware revision of the hardware component
      health:
        type: string
        description: The health status for the hardware component (HEALTHY, INITIALIZING, REBUILDING, WARNING, DEGRADED, UNCONFIGURED, MISSING, OFFLINE, FAILED, or HEALTH UNKNOWN)
      manufacturer:
        type: string
        description: The manufacturer of the hardware component
      model_number:
        type: string
        description: The model number of the hardware component
      physical_drives:
        description: A list of physical drives
        $ref: '#/definitions/physical_drive'
      serial_number:
        type: string
        description: The serial number of the hardware component
      status:
        type: string
        description: The status of the hardware component (GREEN, YELLOW, RED, or UNKNOWN)
    description: The drive set information
  host_hardware:
    type: object
    required:
    - battery
    - firmware_revision
    - host_id
    - logical_drives
    - manufacturer
    - model_number
    - name
    - raid_card
    - serial_number
    - status
    properties:
      accelerator_card:
        description: The accelerator card information for the host
        $ref: '#/definitions/accelerator_card'
      battery:
        description: The backup battery unit information for the host
        $ref: '#/definitions/battery'
      firmware_revision:
        type: string
        description: The firmware revision of the hardware component
      host_id:
        type: string
        description: The unique identifier (UID) of the host
      logical_drives:
        description: A list of logical drives for the host
        $ref: '#/definitions/logical_drive'
      manufacturer:
        type: string
        description: The manufacturer of the hardware component
      model_number:
        type: string
        description: The model number of the hardware component
      name:
        type: string
        description: The name of the host
      raid_card:
        description: The storage adapter information for the host
        $ref: '#/definitions/storage_adapter'
      serial_number:
        type: string
        description: The serial number of the hardware component
      status:
        type: string
        description: The status of the hardware component (GREEN, YELLOW, RED, or UNKNOWN)
    description: A list of hardware modules for the host
  ShutdownStatusMO:
    type: object
    required:
    - status
    properties:
      status:
        type: string
        description: Indicates the shutdown status of the Virtual Controller
        enum:
        - NONE
        - IN_PROGRESS
        - CANCEL_IN_PROGRESS
        - FORCE_IN_PROGRESS
        - HA
  ShutdownVirtualControllerMO:
    type: object
    properties:
      ha_wait:
        type: boolean
        example: true
        description: 'An indicator to show if the user wants to shut down the Virtual Controller safely or forcefully.


          Valid values:


          True: Virtual Controller waits for the virtual machines to reach HA compliance before shutting down


          False: Virtual Controller forced to shut down without waiting for HA compliance


          Default: True'
  physical_drive:
    type: object
    required:
    - additional_status
    - capacity
    - enclosure
    - firmware_revision
    - health
    - life_remaining
    - manufacturer
    - media_type
    - model_number
    - percent_rebuilt
    - serial_number
    - slot
    - status
    - wwn
    properties:
      additional_status:
        type: string
        description: A list of additional statuses for the hardware component. Note that this information is currently only available for solid state drives (SSDs) (SSD life Warn or SSD life Critical).
      capacity:
        type: integer
        format: int64
        description: The capacity of the drive (in bytes)
      drive_position:
        type: string
        description: The position of the drive
      enclosure:
        type: integer
        format: int32
        description: The enclosure number of the drive
      firmware_revision:
        type: string
        description: The firmware revision of the hardware component
      health:
        type: string
        description: The health status for the hardware component (HEALTHY, INITIALIZING, REBUILDING, WARNING, DEGRADED, UNCONFIGURED, MISSING, OFFLINE, FAILED, or HEALTH UNKNOWN)
      life_remaining:
        type: integer
        format: int32
        description: The percentage of solid state drive (SSD) life remaining
      manufacturer:
        type: string
        description: The manufacturer of the hardware component
      media_type:
        type: string
        description: The media type of the drive (Unknown, HDD, SSD)
        enum:
        - UNKNOWN
        - HDD
        - SSD
      model_number:
        type: string
        description: The model number of the hardware component
      percent_rebuilt:
        type: integer
        format: int32
        description: The percentage of rebuilt action for the driver
      serial_number:
        type: string
        description: The serial number of the hardware component
      slot:
        type: integer
        format: int32
        description: The slot number of the drive
      status:
        type: string
        description: The status of the hardware component (GREEN, YELLOW, RED, or UNKNOWN)
      wwn:
        type: string
        description: The WWN number for the driver
    description: The physical drive
  logical_drive:
    type: object
    required:
    - cache_state
    - capacity
    - drive_sets
    - firmware_revision
    - health
    - manufacturer
    - model_number
    - name
    - serial_number
    - status
    properties:
      cache_state:
        type: string
        description: The cache state for the drive
      capacity:
        type: integer
        format: int64
        description: The capacity of the drive (in bytes)
      drive_sets:
        description: A list of the drive sets
        $ref: '#/definitions/drive_set'
      firmware_revision:
        type: string
        description: The firmware revision of the hardware component
      health:
        type: string
        description: The health status for the hardware component (HEALTHY, INITIALIZING, REBUILDING, WARNING, DEGRADED, UNCONFIGURED, MISSING, OFFLINE, FAILED, or HEALTH UNKNOWN)
      manufacturer:
        type: string
        description: The manufacturer of the hardware component
      model_number:
        type: string
        description: The model number of the hardware component
      name:
        type: integer
        format: int64
        description: The name of the drive
      serial_number:
        type: string
        description: The serial number of the hardware component
      status:
        type: string
        description: The status of the hardware component (GREEN, YELLOW, RED, or UNKNOWN)
    description: A host that is defined on this system
  accelerator_card:
    type: object
    required:
    - firmware_revision
    - model_number
    - serial_number
    - status
    - temperature
    properties:
      firmware_revision:
        type: string
        description: The firmware revision of the hardware component
      model_number:
        type: string
        description: The model number of the hardware component
      serial_number:
        type: string
        description: The serial number of the hardware component
      status:
        type: string
        description: The status of the hardware component (GREEN, YELLOW, RED, or UNKNOWN)
      temperature:
        type: integer
        format: int32
        description: The temperature of the hardware component
    description: The accelerator card information for the host
  ShutdownResponseMO:
    type: object
    required:
    - status
    properties:
      status:
        type: string
        description: The status of the process to shut down, cancel, or force the shutdown of the Virtual Controller
        enum:
        - SUCCESS
        - FAILURE
        - UNKNOWN
        - IN_PROGRESS
  capacity_info:
    type: object
    required:
    - data_points
    - name
    properties:
      data_points:
        type: array
        description: The metrics data points
        items:
          $ref: '#/definitions/MetricsRawDataMO'
      name:
        type: string
        description: The name of the set of metrics (stored_compressed_data, compression_ratio, deduplication_ratio, capacity_savings, efficiency_ratio, local_backup_capacity, used_logical_capacity, remote_backup_capacity, stored_virtual_machine_data, stored_uncompressed_data, used_capacity, free_space, allocated_capacity)
    description: The metrics information
  remove_from_federation:
    type: object
    properties:
      force:
        type: boolean
        example: false
        description: An indicator to force a retention time modification even if this action results in deleting backups
    description: Removes the specified host from the federation. The specified hostId must not be the host executing the request.
  TaskMO:
    type: object
    required:
    - affected_objects
    - end_time
    - id
    - start_time
    - state
    properties:
      affected_objects:
        type: array
        description: For a completed task, the unique identifiers (UIDs) and types of the objects affected by the operation
        items:
          $ref: '#/definitions/AffectedObjectMO'
      end_time:
        type: string
        description: The time the task finished, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      error_code:
        type: integer
        format: int32
        description: The error code returned if a task failed
      error_message:
        type: string
        description: The error message returned if a task fails
      id:
        type: string
        description: The unique identifier (UID) of the task
      start_time:
        type: string
        description: The time the task started, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      state:
        type: string
        description: The current state of the task object
        enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    description: A task that was created as a result of an operation performed on the system
securityDefinitions:
  OAuth2:
    type: oauth2
    tokenUrl: /oauth/token
