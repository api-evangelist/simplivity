definitions:
  AffectedObjectMO:
    type: object
    required:
    - object_id
    - object_type
    properties:
      object_id:
        type: string
        description: The unique identifier (UID) of the object affected by the completed task
      object_type:
        type: string
        description: The type of the object affected by the completed task (virtual_machine, datastore, omnistack_cluster, backup, host, policy, rule)
  BackupMO:
    type: object
    required:
    - application_consistent
    - associated_cluster
    - backup_store_type
    - cluster_group_ids
    - compute_cluster_parent_hypervisor_object_id
    - compute_cluster_parent_name
    - consistency_type
    - created_at
    - datastore_id
    - datastore_name
    - expiration_time
    - hypervisor_type
    - id
    - name
    - omnistack_cluster_id
    - omnistack_cluster_name
    - sent
    - sent_completion_time
    - sent_duration
    - size
    - state
    - type
    - unique_size_bytes
    - unique_size_timestamp
    - virtual_machine_id
    - virtual_machine_name
    - virtual_machine_state
    - virtual_machine_type
    properties:
      application_consistent:
        type: boolean
        example: false
        description: An indicator to show if the backup represents a snapshot of a virtual machine with data that was first flushed to disk
      associated_cluster:
        type: string
        description: The cluster associated with the external_store
      backup_store_type:
        type: string
        description: The storage type of the backup
        enum:
        - SimplivityStore
        - StoreOnceOnPrem
        - StoreOnceCloud
        - Unknown
      cluster_group_ids:
        type: array
        description: The unique identifiers (UIDs) of the cluster_groups associated with the backup
        items:
          type: string
      compute_cluster_parent_hypervisor_object_id:
        type: string
        description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      compute_cluster_parent_name:
        type: string
        description: The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
      consistency_type:
        type: string
        description: The consistency type of the backup
        enum:
        - NONE
        - DEFAULT
        - FAILEDVSS
        - NOT_APPLICABLE
        - VSS
      created_at:
        type: string
        description: The time the backup was created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      datastore_id:
        type: string
        description: The unique identifier (UID) of the datastore that is associated with the instance
      datastore_name:
        type: string
        description: The name of the datastore that is associated with the instance
      expiration_time:
        type: string
        description: The time the backup expired (and was deleted), unless locked. This time is expressed in ISO-8601 form, based on Coordinated Universal Time (UTC).
      external_store_name:
        type: string
        description: The name of the external_store
      hypervisor_type:
        type: string
        description: The type of Hypervisor Management System (HMS) associated with the backup
        enum:
        - VSPHERE
        - HYPERV
      id:
        type: string
        description: the unique identifier (UID) of the backup
      name:
        type: string
        description: The name of the backup
      omnistack_cluster_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster that is associated with the instance
      omnistack_cluster_name:
        type: string
        description: The name of the omnistack_cluster that is associated with the instance
      sent:
        type: integer
        format: int64
        description: For a backup stored in a remote location, the number of bytes that transferred
      sent_completion_time:
        type: string
        description: The time when the backup replication completed, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      sent_duration:
        type: integer
        format: int64
        description: The number of seconds that elapsed while replicating the backup
      size:
        type: integer
        format: int64
        description: The logical size of the backup
      state:
        type: string
        description: The current state of the backup
        enum:
        - NEW
        - SAVING
        - FAILED
        - PROTECTED
        - UNKNOWN
        - CANCELING
        - CANCELED
        - QUEUED
        - REBUILDING
        - DELETED
        - DEGRADED
      type:
        type: string
        description: The type of backup
        enum:
        - MANUAL
        - POLICY
        - UNSPECIFIED
      unique_size_bytes:
        type: integer
        format: int64
        description: The unique size of the backup
      unique_size_timestamp:
        type: string
        description: The time the unique size of the backup was calculated, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      virtual_machine_id:
        type: string
        description: The unique identifier (UID) of the virtual_machine that is associated with the instance
      virtual_machine_name:
        type: string
        description: The name of the virtual_machine that is associated with the instance
      virtual_machine_state:
        type: string
        description: The state of the virtual_machine
        enum:
        - ALIVE
        - REMOVED
        - DELETED
      virtual_machine_type:
        type: string
        description: The type of the virtual_machine that is associated with the instance
        enum:
        - VM
        - TEMPLATE
        - UNKNOWN
  restore_file:
    type: object
    required:
    - paths
    - virtual_machine_id
    properties:
      virtual_machine_id:
        type: string
        description: The identification number of the virtual machine where you want to restore the files
      paths:
        type: array
        description: 'The paths to the files in this format: virtual_machine_disk_name/partition_number/path_to_file (for example, "vmdk1.vmdk/2/Documents/file.txt")'
        items:
          type: string
    description: Restore files from a specific partition
  BackupFileDataMO:
    type: object
    required:
    - directory
    - file_level_restore_available
    - last_modified
    - name
    - size
    - symbolic_link
    properties:
      directory:
        type: boolean
        example: false
        description: Indicates if the file is a directory
      file_level_restore_available:
        type: boolean
        example: false
        description: Indicates if the file is supported for file level restore
      last_modified:
        type: string
        description: 'The time when the file was last modified, expressed in ISO-8601 form, based on Coordinated Universal Time(UTC). Format: yyyy-mm-ddTHH:mm:ssZ'
      name:
        type: string
        description: The name of the file
      size:
        type: integer
        format: int64
        description: The size of the file(in bytes)
      symbolic_link:
        type: boolean
        example: false
        description: Indicates if the file is a symbolic link
  rename_backup:
    type: object
    required:
    - backup_name
    properties:
      backup_name:
        type: string
        description: The new name for the backup
    description: Renames the specified backup
  BackupPartitionDataMO:
    type: object
    required:
    - disk_type
    - mountable
    - partition_number
    - size
    properties:
      disk_type:
        type: string
        description: The partition disk type (for example, GPT or BIOS)
      mountable:
        type: boolean
        example: false
        description: Indicates if the application can mount the partition
      partition_number:
        type: integer
        format: int32
        description: The partition number for the partition
      size:
        type: integer
        format: int64
        description: The size of the partition in bytes
  backup_copy:
    type: object
    required:
    - destination_id
    - external_store_name
    properties:
      destination_id:
        type: string
        description: The unique identifier (UID) of the omnistack_cluster that stores the new backup
      external_store_name:
        type: string
        description: The name of the external_store
    description: Copies the specified backup to another omnistack_cluster or external_store
  BackupVirtualDiskMO:
    type: object
    required:
    - virtual_disks
    properties:
      virtual_disks:
        type: array
        description: List of backup virtual hard disk files
        items:
          type: object
  backup_retention_set:
    type: object
    required:
    - backup_id
    - retention
    properties:
      backup_id:
        type: array
        description: The list of the unique identifier (UID) of the backups that you want to set the retention time for
        items:
          type: string
      retention:
        type: integer
        format: int32
        description: The number of minutes to keep backups
      force:
        type: boolean
        example: false
        description: An indicator to force a retention time modification even if this action results in deleting backups
      forever:
        type: boolean
        example: false
        description: 'Retains backups indefinitely '
    description: Sets the retention time for the specified list of backups
  delete_backups:
    type: object
    required:
    - backup_id
    properties:
      backup_id:
        type: array
        description: The list of the unique identifier (UID) of the backups that you want to delete
        items:
          type: string
      cluster_group_id:
        type: string
        description: The cluster group id of the backup list
    description: Deletes the specified list of backup instances
  TaskMO:
    type: object
    required:
    - affected_objects
    - end_time
    - id
    - start_time
    - state
    properties:
      affected_objects:
        type: array
        description: For a completed task, the unique identifiers (UIDs) and types of the objects affected by the operation
        items:
          $ref: '#/definitions/AffectedObjectMO'
      end_time:
        type: string
        description: The time the task finished, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      error_code:
        type: integer
        format: int32
        description: The error code returned if a task failed
      error_message:
        type: string
        description: The error message returned if a task fails
      id:
        type: string
        description: The unique identifier (UID) of the task
      start_time:
        type: string
        description: The time the task started, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
      state:
        type: string
        description: The current state of the task object
        enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    description: A task that was created as a result of an operation performed on the system
  restore_virtual_machine:
    type: object
    required:
    - virtual_machine_name
    properties:
      virtual_machine_name:
        type: string
        description: The name of the new virtual machine that this action creates
      datastore_id:
        type: string
        description: '(Optional) The unique identifier (UID) of the datastore where the new virtual machine gets created


          Default: Creates the virtual machine in the same datastore as the one used by the chosen backup'
    description: Creates a new virtual machine or replaces the original virtual machine from the specified backup
securityDefinitions:
  OAuth2:
    type: oauth2
    tokenUrl: /oauth/token
    flow: password
    scopes:
      read: Grants read access
      write: Grants write access
