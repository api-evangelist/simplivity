openapi: 3.2.0
info:
  description: This API enables the programmatic management of key components of an HPE SimpliVity configuration.
  version: '1.25'
  title: HPE OmniStack REST Cluster Groups API
  contact:
    name: Hewlett Packard Enterprise
  license:
    name: HPE OmniStack REST API
servers:
- url: https://localhost
tags:
- name: cluster groups
  description: A set of omnistack_clusters that are able to perform backup and restore operations between each other
paths:
  /cluster_groups:
    get:
      tags:
      - cluster groups
      summary: Retrieves all cluster_groups
      operationId: listClusterGroups
      parameters:
      - name: id
        in: query
        description: 'The unique identifier (UID) of the cluster_groups to return


          Accepts: Single value, comma-separated list'
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: 'The name of the cluster_groups to return


          Accepts: Single value, comma-separated list, pattern using one or more asterisk characters as a wildcard'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: "A comma-separated list of fields to include in the returned objects\n\n Default: Returns all fields"
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'A positive integer that represents the maximum number of results to return


          Default: 500'
        required: false
        schema:
          type: integer
          format: int32
          default: 500
      - name: offset
        in: query
        description: 'A positive integer that directs the service to start returning the &lt;offset value&gt; instance, up to the limit


          Default: 0'
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: case
        in: query
        description: 'An indicator that specifies if the filter and sort results use a case-sensitive or insensitive manner


          Valid values: sensitive or insensitive


          Default: sensitive'
        required: false
        schema:
          type: string
          enum:
          - sensitive
          - insensitive
          default: sensitive
      - name: sort
        in: query
        description: The name of the field where the sort occurs
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: 'The sort order preference


          Valid values: ascending or descending


          Default: descending'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.simplivity.v1.19+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.23+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.9+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.18+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.13+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.16+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.24+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.7+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.14+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.11+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.17+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.21+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.22+json:
              schema:
