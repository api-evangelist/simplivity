            application/vnd.simplivity.v1.25+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.12+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
            application/vnd.simplivity.v1.20+json:
              schema:
                $ref: '#/components/schemas/clusterGroup'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /cluster_groups/{clusterGroupId}/rename:
    post:
      tags:
      - cluster groups
      summary: Renames the specified cluster_group
      operationId: renameClusterGroup
      parameters:
      - name: clusterGroupId
        in: path
        description: The unique identifier (UID) of the cluster_group
        required: true
        schema:
          type: string
      responses:
