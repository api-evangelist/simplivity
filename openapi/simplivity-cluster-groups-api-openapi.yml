        description: 'cluster_group_name: The new name for the cluster_group'
        required: true
components:
  schemas:
    rename_cluster_group:
      type: object
      required:
      - cluster_group_name
      properties:
        id:
          type: string
        revision:
          type: integer
          format: int32
        cluster_group_name:
          type: string
          description: The new name for the cluster_group
      description: Renames the specified cluster_group
    TaskMO:
      type: object
      required:
      - affected_objects
      - end_time
      - id
      - start_time
      - state
      properties:
        affected_objects:
          type: array
          description: For a completed task, the unique identifiers (UIDs) and types of the objects affected by the operation
          items:
            $ref: '#/components/schemas/AffectedObjectMO'
        end_time:
          type: string
          description: The time the task finished, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        error_code:
          type: integer
          format: int32
          description: The error code returned if a task failed
        error_message:
          type: string
          description: The error message returned if a task fails
        id:
          type: string
          description: The unique identifier (UID) of the task
        start_time:
          type: string
          description: The time the task started, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        state:
          type: string
          description: The current state of the task object
          enum:
          - IN_PROGRESS
          - COMPLETED
          - FAILED
      description: A task that was created as a result of an operation performed on the system
    clusterGroup:
      type: object
      required:
      - clusters
      - id
      - name
      properties:
        clusters:
          type: array
          description: The unique identifiers (UIDs) of the omnistack_clusters that are defined in the cluster_group
          items:
            type: string
        id:
          type: string
          description: The unique identifier (UID) of the cluster_group
        name:
          type: string
          description: The name of the cluster_group
      description: A cluster_group
    AffectedObjectMO:
      type: object
      required:
      - object_id
      - object_type
      properties:
        object_id:
          type: string
          description: The unique identifier (UID) of the object affected by the completed task
        object_type:
          type: string
          description: The type of the object affected by the completed task (virtual_machine, datastore, omnistack_cluster, backup, host, policy, rule)
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        password:
          scopes:
            read: Grants read access
            write: Grants write access
          tokenUrl: /oauth/token
