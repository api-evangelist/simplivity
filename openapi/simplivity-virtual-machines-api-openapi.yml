          type: string
          description: The name of the virtual_machine created from this action
        app_consistent:
          type: boolean
          example: false
          description: '[deprecated] An indicator to show if the backup represents a snapshot of a virtual machine with data that was first flushed to disk'
        consistency_type:
          type: string
          description: 'The type of backup used for the clone method (DEFAULT [crash-consistent], VSS [application-consistent using VSS], or NONE [application-consistent using a snapshot]).


            NOTE: If the consistency_type and app_consistent values are both set, the value for consistency_type overrides the value for app_consistent.


            If consisteny_type is not set and the app_consistent value is set to True, the consistency_type value equals DEFAULT (crash-consistent). If the app_consistent value is set to False, the consistency_type value equalsNONE (application-consistent using a snapshot'
          enum:
          - NONE
          - DEFAULT
          - FAILEDVSS
          - NOT_APPLICABLE
          - VSS
    validate_backup_credentials:
      type: object
      required:
      - guest_password
      - guest_username
      properties:
        guest_username:
          type: string
          description: The user name of the virtual machine
        guest_password:
          type: string
          description: The password of the virtual machine
      description: Validates the credentials for the virtual machine you want to backup
    MetricsDataMO:
      type: object
      required:
      - date
      - reads
      - writes
      properties:
        date:
          type: string
          description: The date for the set of metrics, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        reads:
          type: integer
          format: int64
          description: The number of reads per second or latency (in microseconds) or throughput (in bytes per second)
        writes:
          type: integer
          format: int64
          description: The number of writes per second or latency (in microseconds) or throughput (in bytes per second)
    vm_set_policy_vms:
      type: object
      required:
      - policy_id
      - virtual_machine_id
      properties:
        virtual_machine_id:
          type: array
          description: The unique identifier (UID) of each virtual_machine that you want to associate with the specified policy
          items:
            type: string
        policy_id:
          type: string
          description: The unique identifier (UID) of the policy you want to access
      description: Sets the backup policy for virtual machines
    NetworkInterface:
      type: object
      required:
      - adapter_type
      - device_number
      - ipv4_addresses
      - mac_address
      - mac_generation
      - network_label
      properties:
        adapter_type:
          type: string
          description: The adapter type of the network_interface
          enum:
          - E1000
          - E1000E
          - PCNET32
          - VMXNET
          - VNXNET2
          - VMXNET3
          - UNKNOWN
        device_number:
          type: string
          description: The device number of the network_interface; empty if this represents a new network_interface
        ipv4_addresses:
          type: array
          description: The IPV4 address(es) assigned to the network_interface
          items:
            type: string
        mac_address:
          type: string
          description: If mac_generation is set to MANUAL, specifies the MAC address assigned to the network_interface
        mac_generation:
          type: string
          description: Specifies how the MAC address for the network_interface is generated
          enum:
          - ASSIGNED
          - GENERATED
          - MANUAL
          - UNKNOWN
        network_label:
          type: string
          description: The network ID associated with the network_interface
