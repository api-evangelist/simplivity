components:
  schemas:
    analytics_info:
      type: object
      required:
      - data_points
      - name
      properties:
        data_points:
          type: array
          description: The metrics data points
          items:
            $ref: '#/components/schemas/MetricsDataMO'
        name:
          type: string
          description: The name of the set of metrics (iops, throughput, latency)
      description: The metrics information
    TaskMO:
      type: object
      required:
      - affected_objects
      - end_time
      - id
      - start_time
      - state
      properties:
        affected_objects:
          type: array
          description: For a completed task, the unique identifiers (UIDs) and types of the objects affected by the operation
          items:
            $ref: '#/components/schemas/AffectedObjectMO'
        end_time:
          type: string
          description: The time the task finished, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        error_code:
          type: integer
          format: int32
          description: The error code returned if a task failed
        error_message:
          type: string
          description: The error message returned if a task fails
        id:
          type: string
          description: The unique identifier (UID) of the task
        start_time:
          type: string
          description: The time the task started, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        state:
          type: string
          description: The current state of the task object
          enum:
          - IN_PROGRESS
          - COMPLETED
          - FAILED
      description: A task that was created as a result of an operation performed on the system
    BackupMO:
      type: object
      required:
      - application_consistent
      - associated_cluster
      - backup_store_type
      - cluster_group_ids
      - compute_cluster_parent_hypervisor_object_id
      - compute_cluster_parent_name
      - consistency_type
      - created_at
      - datastore_id
      - datastore_name
      - expiration_time
      - hypervisor_type
      - id
      - name
      - omnistack_cluster_id
      - omnistack_cluster_name
      - sent
      - sent_completion_time
      - sent_duration
      - size
      - state
      - type
      - unique_size_bytes
      - unique_size_timestamp
      - virtual_machine_id
      - virtual_machine_name
      - virtual_machine_state
      - virtual_machine_type
      properties:
        application_consistent:
          type: boolean
          example: false
          description: An indicator to show if the backup represents a snapshot of a virtual machine with data that was first flushed to disk
        associated_cluster:
          type: string
          description: The cluster associated with the external_store
        backup_store_type:
          type: string
          description: The storage type of the backup
          enum:
          - SimplivityStore
          - StoreOnceOnPrem
          - StoreOnceCloud
          - Unknown
        cluster_group_ids:
          type: array
          description: The unique identifiers (UIDs) of the cluster_groups associated with the backup
          items:
            type: string
        compute_cluster_parent_hypervisor_object_id:
          type: string
          description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
        compute_cluster_parent_name:
          type: string
          description: The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
        consistency_type:
          type: string
          description: The consistency type of the backup
          enum:
          - NONE
          - DEFAULT
          - FAILEDVSS
          - NOT_APPLICABLE
          - VSS
        created_at:
          type: string
          description: The time the backup was created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        datastore_id:
          type: string
          description: The unique identifier (UID) of the datastore that is associated with the instance
        datastore_name:
          type: string
          description: The name of the datastore that is associated with the instance
        expiration_time:
          type: string
          description: The time the backup expired (and was deleted), unless locked. This time is expressed in ISO-8601 form, based on Coordinated Universal Time (UTC).
        external_store_name:
          type: string
          description: The name of the external_store
        hypervisor_type:
          type: string
          description: The type of Hypervisor Management System (HMS) associated with the backup
          enum:
          - VSPHERE
          - HYPERV
        id:
          type: string
          description: the unique identifier (UID) of the backup
        name:
          type: string
          description: The name of the backup
        omnistack_cluster_id:
          type: string
          description: The unique identifier (UID) of the omnistack_cluster that is associated with the instance
        omnistack_cluster_name:
          type: string
          description: The name of the omnistack_cluster that is associated with the instance
        sent:
          type: integer
          format: int64
          description: For a backup stored in a remote location, the number of bytes that transferred
        sent_completion_time:
          type: string
          description: The time when the backup replication completed, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        sent_duration:
          type: integer
          format: int64
          description: The number of seconds that elapsed while replicating the backup
        size:
          type: integer
          format: int64
          description: The logical size of the backup
        state:
          type: string
          description: The current state of the backup
          enum:
          - NEW
          - SAVING
          - FAILED
          - PROTECTED
          - UNKNOWN
          - CANCELING
          - CANCELED
          - QUEUED
          - REBUILDING
          - DELETED
          - DEGRADED
        type:
          type: string
          description: The type of backup
          enum:
          - MANUAL
          - POLICY
          - UNSPECIFIED
        unique_size_bytes:
          type: integer
          format: int64
          description: The unique size of the backup
        unique_size_timestamp:
          type: string
          description: The time the unique size of the backup was calculated, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        virtual_machine_id:
          type: string
          description: The unique identifier (UID) of the virtual_machine that is associated with the instance
        virtual_machine_name:
          type: string
          description: The name of the virtual_machine that is associated with the instance
        virtual_machine_state:
          type: string
          description: The state of the virtual_machine
          enum:
          - ALIVE
          - REMOVED
          - DELETED
        virtual_machine_type:
          type: string
          description: The type of the virtual_machine that is associated with the instance
          enum:
          - VM
          - TEMPLATE
          - UNKNOWN
    move_virtual_machine:
      type: object
      required:
      - destination_datastore_id
      properties:
        virtual_machine_name:
          type: string
          description: The name of the virtual_machine created from this action
        destination_datastore_id:
          type: string
          description: The unique identifier (UID) of the destination datastore for the move
      description: Moves a virtual machine to another datastore
    AffectedObjectMO:
      type: object
      required:
      - object_id
      - object_type
      properties:
        object_id:
          type: string
          description: The unique identifier (UID) of the object affected by the completed task
        object_type:
          type: string
          description: The type of the object affected by the completed task (virtual_machine, datastore, omnistack_cluster, backup, host, policy, rule)
    backup_parameters:
      type: object
      properties:
        guest_username:
          type: string
          description: The user name of the virtual machine
        guest_password:
          type: string
          description: The password of the virtual machine
        override_guest_validation:
          type: boolean
          example: false
          description: Set to true to disable virtual machine validation logic.
        app_aware_type:
          type: string
          description: "Set the application aware backup type: \nVSS - Application-consistent backup using Microsoft VSS, \nDEFAULT - Crash-consistent backup, \nNONE - Application-consistent backup using a VMware snapshot."
          enum:
          - NONE
          - DEFAULT
          - FAILEDVSS
          - NOT_APPLICABLE
          - VSS
      description: Set the virtual machine backup parameters used for application consistent backups.
    ReplicaInfo:
      type: object
      required:
      - id
      - role
      properties:
        id:
          type: string
          description: The unique identifier (UID) of the host storing the replica
        role:
          type: string
          description: The role of the replica
          enum:
          - PRIMARY
          - SECONDARY
    policy_schedule_report:
      type: object
      required:
      - backup_rate_level
      - daily_backup_rate
      - daily_backup_rate_limit
      - projected_retained_backups
      - projected_retained_backups_level
      - retained_backups_limit
      properties:
        backup_rate_level:
          type: integer
          format: int32
          description: The ratio in percent of daily_backup_rate vs daily_backup_rate_limit (i.e. What % of the maximum limit is currently specified)
        daily_backup_rate:
          type: integer
          format: int32
          description: The average number of backups created in a day in the federation as determined by the current set of backup policies and their rules, and the virtual machines assigned to those backup policies
        daily_backup_rate_limit:
          type: integer
          format: int32
          description: The maximum number of policy backups allowed to be created in the federation each day
        projected_retained_backups:
          type: integer
          format: int32
          description: The projection of the maximum number of backups that could be retained given the frequency and retention time specified by the backup policies and the virtual machines assigned to those backup policies
        projected_retained_backups_level:
          type: integer
          format: int32
          description: The ratio in percent of projected_retained_backups vs retained_backups_limit (i.e. What % of the maximum limit is currently specified)
        retained_backups_limit:
          type: integer
          format: int32
          description: The maximum number of policy backups the federation is permitted to have at any given time
      description: A policy on this system
    virtual_machine:
      type: object
      required:
      - app_aware_vm_status
      - cluster_group_ids
      - compute_cluster_parent_hypervisor_object_id
      - compute_cluster_parent_name
      - created_at
      - datastore_id
      - datastore_name
      - deleted_at
      - host_id
      - hypervisor_management_system
      - hypervisor_management_system_name
      - hypervisor_object_id
      - hypervisor_type
      - id
      - name
      - omnistack_cluster_id
      - omnistack_cluster_name
      - policy_id
      - policy_name
      - replica_set
      - state
      properties:
        app_aware_vm_status:
          type: string
          description: The status of the ability of the virtual machine to take an application-consistent backup that uses Microsoft VSS
          enum:
          - UNKNOWN
          - CAPABLE
          - INVALID_CREDS
          - VALID_CREDS
          - VMWARE_TOOLS_UNAVAILABLE
          - INVALID_OS
          - UNKNOWN_FAULT
        cluster_group_ids:
          type: array
          description: The unique identifiers (UIDs) of the cluster_groups associated with the virtual_machine
          items:
            type: string
        compute_cluster_parent_hypervisor_object_id:
          type: string
          description: The unique identifier (UID) of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
        compute_cluster_parent_name:
          type: string
          description: The name of the hypervisor-based instance that contains the omnistack_cluster that is associated with the instance
        created_at:
          type: string
          description: The time a virtual_machine was created, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        datastore_id:
          type: string
          description: The unique identifier (UID) of the datastore that is associated with the instance
        datastore_name:
          type: string
          description: The name of the datastore that is associated with the instance
        deleted_at:
          type: string
          description: The time a virtual_machine was deleted, expressed in ISO-8601 form, based on Coordinated Universal Time (UTC)
        ha_resynchronization_progress:
          type: integer
          format: int32
          description: The HA resynchronization progress as a percentage (0-100)
        ha_status:
          type: string
          description: The High Availability status of the virtual_machine
          enum:
          - UNKNOWN
          - OUT_OF_SCOPE
          - NOT_APPLICABLE
          - DEGRADED
          - SAFE
          - SYNCING
          - DEFUNCT
        host_id:
          type: string
          description: The unique identifier (UID) of the virtual_machine host
        host_name:
          type: string
          description: The name of the host that this virtual machine is currently assigned to
        hypervisor_allocated_capacity:
          type: integer
          format: int64
          description: The total number of bytes allocated to this virtual machine across all datastores
        hypervisor_allocated_cpu:
          type: integer
          format: int64
          description: The amount of CPU available to this virtual machine in MHz
        hypervisor_consumed_cpu:
          type: integer
          format: int64
          description: The amount of CPU consumed by this virtual machine in MHz
        hypervisor_consumed_memory:
          type: integer
          format: int32
