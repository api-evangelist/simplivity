          description: The number of virtual CPUs allocated to this virtual machine
        hypervisor_folder_name:
          type: string
          description: The name of the folder this virtual machine is stored in
        hypervisor_free_space:
          type: integer
          format: int64
          description: The number of bytes of free space available to this virtual machine across all datastores
        hypervisor_instance_id:
          type: string
          description: The unique identifier (UID) of the hypervisor-based instance associated with a virtual_machine
        hypervisor_is_template:
          type: boolean
          example: false
          description: An indicator that shows if the virtual machine is a template
        hypervisor_managed_by:
          type: string
          description: The managed by property of the virtual machine
        hypervisor_management_system:
          type: string
          description: The IP address of the hypervisor-based instance associated with the virtual machine
        hypervisor_management_system_name:
          type: string
          description: The name of the hypervisor-based instance associated with the virtual machine
        hypervisor_object_id:
          type: string
          description: The unique identifier (UID) of the hypervisor-based instance associated with a virtual_machine
        hypervisor_total_memory:
          type: integer
          format: int32
          description: The number of MB allocated to this virtual machine
        hypervisor_type:
          type: string
          description: The type of hypervisor associated with the virtual_machine
          enum:
          - VSPHERE
          - HYPERV
        hypervisor_uuid:
          type: string
          description: The SMBIOS unique identifier (UID) of the hypervisor-based instance associated with a virtual_machine
        hypervisor_virtual_disk_count:
          type: integer
          format: int32
          description: The number of virtual disks assigned to this virtual machine
        hypervisor_virtual_machine_power_state:
          type: string
          description: The power state of the virtual machine (ON, OFF, SUSPENDED, or UNKNOWN)
          enum:
          - 'ON'
          - 'OFF'
          - SUSPENDED
          - UNKNOWN
        id:
          type: string
          description: The unique identifier (UID) of the virtual_machine
        name:
          type: string
          description: The name of the virtual_machine
        network_interfaces:
          type: array
          description: A virtualized network interface associated with the virtual_machine
          items:
            $ref: '#/components/schemas/NetworkInterface'
        omnistack_cluster_id:
          type: string
          description: The unique identifier (UID) of the omnistack_cluster that is associated with the instance
        omnistack_cluster_name:
          type: string
          description: The name of the omnistack_cluster that is associated with the instance
        policy_id:
          type: string
          description: The unique identifier (UID) of the policy that is associated with the instance
        policy_name:
          type: string
          description: The name of the policy that is associated with the instance
        replica_set:
          type: array
          description: The primary and secondary hosts that store a replica of the data for this virtual_machine
          items:
            $ref: '#/components/schemas/ReplicaInfo'
        state:
          type: string
          description: The state of the virtual_machine
          enum:
          - ALIVE
          - REMOVED
          - DELETED
      description: An instance of a virtual_machine defined on this system
    credentials_validation:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The credentials validation status
          enum:
          - VM_POWERED_OFF
          - INVALID
          - VALID
      description: Status of the virtual machine credentials validation operation
    BackupVMMO:
      type: object
