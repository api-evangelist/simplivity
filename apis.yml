name: SimpliVity
description: >-
  SimpliVity is the hyperconverged infrastructure (HCI) pioneer acquired by Hewlett
  Packard Enterprise in 2017 and now shipped as HPE SimpliVity. Its data virtualization
  platform runs on the OmniStack software stack, delivering built-in deduplication,
  compression, backup, replication, and disaster recovery across VMware and Hyper-V
  clusters. The programmatic surface is the HPE OmniStack REST API (v1.25), which
  manages the key components of a SimpliVity configuration — virtual machines, backups,
  backup policies, datastores, hosts, clusters/omnistack_clusters, cluster groups,
  external stores, certificates, and long-running tasks. The API is served on-appliance
  by the Management Virtual Appliance (MVA) and authenticated with an OAuth2 password
  grant that issues read/write bearer tokens. HPE publishes first-party SDKs for
  Python, Go, and PowerShell plus Ansible modules on the HewlettPackard GitHub org.
